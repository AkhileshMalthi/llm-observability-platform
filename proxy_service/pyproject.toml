[project]
name = "proxy-service"
version = "0.1.0"
description = "Enterprise LLM Proxy with Guardrails"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.28.1",
    "presidio-analyzer>=2.2.361",
    "presidio-anonymizer>=2.2.361",
    "pydantic-settings>=2.13.1",
    "redis>=7.2.1",
    "uvicorn[standard]>=0.22.0",
]

[dependency-groups]
dev = ["httpx", "pytest", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')"]
